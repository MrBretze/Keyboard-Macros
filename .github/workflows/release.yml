# Builds the plugin for every platform and packages it.
#
# - On every push / pull request: tests and builds (the zip is kept as a workflow artifact).
# - On a "v*" tag (e.g. v2.0.0): same, then the zip is attached to the GitHub release
#   for that tag. The tag must match "Version" in manifest.json.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the zip to a release

env:
  CARGO_TERM_COLOR: always
  PLUGIN: com.mrbretzel.keymacro.sdPlugin

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: fully static executables, no system library needed.
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, file: keymacro, out: keymacro-linux-x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, file: keymacro, out: keymacro-linux-aarch64 }
          - { name: windows-x86_64, os: windows-2025, target: x86_64-pc-windows-msvc, file: keymacro.exe, out: keymacro-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" "dist/${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('$PLUGIN/manifest.json'))['Version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Assemble the zip
        run: |
          cp dist/keymacro-* "$PLUGIN/"
          chmod 755 "$PLUGIN"/keymacro-linux-*
          zip_name="KeyboardMacros-${{ steps.version.outputs.version }}.zip"
          zip -r -X "$zip_name" "$PLUGIN" -x "*/plugin.log"
          unzip -Z "$zip_name"
          echo "ZIP=$zip_name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: ${{ env.ZIP }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
