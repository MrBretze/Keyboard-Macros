# Builds the plugin for every platform and packages it.
#
# - On every push / pull request: tests and builds (the zip is kept as a workflow artifact).
# - On a "v*" tag (e.g. v2.0.0): same, then the zip is attached to the GitHub release
#   for that tag. The tag must match "Version" in manifest.json.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the packaging job may write (to attach the zip to a release).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PLUGIN: com.mrbretzel.keymacro.sdPlugin

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: fully static executables, no system library needed.
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, file: keymacro, out: keymacro-linux-x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, file: keymacro, out: keymacro-linux-aarch64 }
          - { name: windows-x86_64, os: windows-2025, target: x86_64-pc-windows-msvc, file: keymacro.exe, out: keymacro-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" "dist/${{ matrix.out }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  macos:
    name: macos-universal
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15" # oldest macOS with the permission APIs used
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin && rustup default stable
      - name: Test
        run: cargo test --locked
      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Merge into one universal executable
        run: |
          mkdir -p dist
          lipo -create -output dist/keymacro-macos \
            target/aarch64-apple-darwin/release/keymacro \
            target/x86_64-apple-darwin/release/keymacro
          lipo -info dist/keymacro-macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keymacro-macos
          path: dist/keymacro-macos
          if-no-files-found: error

  package:
    needs: [build, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the zip to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Check the version
        id: version
        run: |
          version=$(python3 -c "import json, re, sys; v = json.load(open(sys.argv[1]))['Version']; assert re.fullmatch(r'[0-9]+(\.[0-9]+){1,3}', v), v; print(v)" "$PLUGIN/manifest.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Assemble the zip
        env:
          # Passed as data, not pasted into the script: the version comes from a repository file.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp dist/keymacro-* "$PLUGIN/"
          chmod 755 "$PLUGIN"/keymacro-linux-* "$PLUGIN"/keymacro-macos
          zip_name="KeyboardMacros-$VERSION.zip"
          zip -r -X "$zip_name" "$PLUGIN" -x "*/plugin.log"
          unzip -Z "$zip_name"
          echo "ZIP=$zip_name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-zip
          path: ${{ env.ZIP }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
