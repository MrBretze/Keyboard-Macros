[package]
name = "keymacro"
version = "2.1.1"
edition = "2024"
rust-version = "1.85" # first release with edition 2024
description = "OpenDeck plugin: record, edit and replay keyboard and mouse macros"
license = "CECILL-2.1"
repository = "https://github.com/MrBretze/Keyboard-Macros"
publish = false

[dependencies]
base64 = "0.23.1"
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[profile.release]
# Small, self-contained executable.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
