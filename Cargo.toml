[package]
name = "keymacro"
version = "2.2.0"
edition = "2024"
rust-version = "1.89" # required by zbus 6
description = "OpenDeck plugin: record, edit and replay keyboard and mouse macros"
license = "CECILL-2.1"
repository = "https://github.com/MrBretze/Keyboard-Macros"
publish = false

[dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false }
log = "0.4.35"
openaction = "2.8.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
libc = "0.2.191"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[profile.release]
# Small, self-contained executable.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
